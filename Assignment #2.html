<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Assignment #2</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        h1 {
            margin-bottom: 10px;
        }

        .toolbar {
            background-color: #384758;
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 8px;
            border-right: 1px solid #7f8c8d;
            padding-right: 15px;
        }

        .tool-group:last-child {
            border-right: none;
        }

        button {
            padding: 8px 12px;
            border: none;
            border-radius: 17px;
            background-color: #7f8c8d;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button.active {
            background-color: #f3811d !important;
        }

        button:hover {
            background-color: #95a5a6;
        }

        input[type="color"] {
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            background: none;
        }

        .canvas-container {
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
            background: white;
        }

        #canvas {
            width: 500px;
            height: 500px;
            border: 2px solid #111;
            image-rendering: pixelated;
            display: block;
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <h1>🎨 ASSIGNMENT #2 PAINT</h1>

    
    <div class="toolbar">
        
        <div class="tool-group">
            <button id="btnPencil" class="active" onclick="setTool('pencil')">🖍️ Pencil</button>
            <button id="btnLine" onclick="setTool('line')">📐 Line</button>
            <button id="btnRect" onclick="setTool('rect')">🀆 Rectangle</button>
            <button id="btnEllipse" onclick="setTool('ellipse')">〇 Ellipse</button>
            <button id="btnEraser" onclick="setTool('eraser')">🧻 Eraser</button>
        </div>

        <!-- เลือกสี -->
        <div class="tool-group">
            <label for="colorPicker">Color :</label>
            <input type="color" id="colorPicker" value="#000000" onchange="updateColor(this.value)">
        </div>

        <!-- เลือกความหนาเส้น -->
        <div class="tool-group">
            <label for="thickness">Thickness :</label>
            <input type="range" id="thickness" min="1" max="10" value="1" oninput="updateThickness(this.value)">
            <span id="thicknessValue">1px</span>
        </div>

        
        <div class="tool-group">
            <button style="background-color: #c0392b;" onclick="clearCanvas()">🗑️ Clear all</button>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="canvas" width="200" height="200"></canvas>
    </div>

<script>
// --- Canvas Setup ---
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const imageData = ctx.createImageData(canvas.width, canvas.height);
const data = imageData.data; 


let currentTool = 'pencil';
let currentColor = { r: 0, g: 0, b: 0 };
let currentThickness = 1;
let isDragging = false;
let startX = 0;
let startY = 0;
let previousMouseX = 0; 
let previousMouseY = 0; 


let snapshotData = new Uint8ClampedArray(data.length);




function putPixel(x, y, r, g, b, a = 255) {
    if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) return;
    const index = (y * canvas.width + x) * 4;
    data[index] = r;     // Red[cite: 1]
    data[index + 1] = g; // Green[cite: 1]
    data[index + 2] = b; // Blue[cite: 1]
    data[index + 3] = a; // Alpha[cite: 1]
}

//ระบายพิกเซล,ความหนา
function drawThickPixel(x, y, thickness, r, g, b, a = 255) {
    const radius = Math.floor(thickness / 2);
    for (let dy = -radius; dy <= radius; dy++) {
        for (let dx = -radius; dx <= radius; dx++) {
            putPixel(x + dx, y + dy, r, g, b, a);
        }
    }
}

//ฟังก์ชันวาดเส้นตรง
function drawLine(x1, y1, x2, y2, r, g, b, thickness = 1, a = 255) {
    const dx = Math.abs(x2 - x1); //[cite: 1]
    const dy = Math.abs(y2 - y1); //[cite: 1]

    if (dx === 0 && dy === 0) {
        drawThickPixel(x1, y1, thickness, r, g, b, a);
        return;
    }

    if (dx > dy) { //[cite: 1]
        const m = (y2 - y1) / (x2 - x1); //[cite: 1]
        const c = y1 - m * x1; //[cite: 1]
        const step = x1 < x2 ? 1 : -1;
        for (let x = x1; x !== x2 + step; x += step) {
            const y = Math.round(m * x + c); //[cite: 1]
            drawThickPixel(x, y, thickness, r, g, b, a);
        }
    } else {
        const m = (x2 - x1) / (y2 - y1); //[cite: 1]
        const c = x1 - m * y1; //[cite: 1]
        const step = y1 < y2 ? 1 : -1;
        for (let y = y1; y !== y2 + step; y += step) {
            const x = Math.round(m * y + c); //[cite: 1]
            drawThickPixel(x, y, thickness, r, g, b, a);
        }
    }
}

//วาดกรอบสี่เหลี่ยม
function drawRect(x1, y1, x2, y2, r, g, b, thickness = 1, a = 255) {
    drawLine(x1, y1, x2, y1, r, g, b, thickness, a); // Top[cite: 1]
    drawLine(x2, y1, x2, y2, r, g, b, thickness, a); // Right[cite: 1]
    drawLine(x2, y2, x1, y2, r, g, b, thickness, a); // Bottom[cite: 1]
    drawLine(x1, y2, x1, y1, r, g, b, thickness, a); // Left[cite: 1]
}

//วาดขอบวงรี/วงกลม
function drawEllipseOutline(cx, cy, rx, ry, r, g, b, thickness = 1, a = 255) {
    if (rx <= 0 || ry <= 0) return;
    const steps = Math.max(rx, ry) * 8; // ความละเอียดของเส้นขอบ
    for (let i = 0; i < steps; i++) {
        const theta = (i / steps) * 2 * Math.PI;
        const x = Math.round(cx + rx * Math.cos(theta));
        const y = Math.round(cy + ry * Math.sin(theta));
        drawThickPixel(x, y, thickness, r, g, b, a);
    }
}



function toScaledMouseCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect(); 
    const scaleX = canvas.width / rect.width; 
    const scaleY = canvas.height / rect.height; 
    return {
        x: Math.floor((clientX - rect.left) * scaleX), 
        y: Math.floor((clientY - rect.top) * scaleY)
    };
}

// ล้าง Canvas ให้เป็นสีขาวทั้งหมด
function clearCanvas() {
    for (let i = 0; i < data.length; i += 4) {
        data[i] = 255;     // R
        data[i + 1] = 255; // G
        data[i + 2] = 255; // B
        data[i + 3] = 255; // A
    }
    ctx.putImageData(imageData, 0, 0); //[cite: 1]
}

// แปลงค่า HEX (#RRGGBB) เป็น RGB
function hexToRgb(hex) {
    const bigint = parseInt(hex.slice(1), 16);
    return {
        r: (bigint >> 16) & 255,
        g: (bigint >> 8) & 255,
        b: bigint & 255
    };
}


function saveSnapshot() {
    snapshotData.set(data);
}

function restoreSnapshot() {
    data.set(snapshotData);
}



function setTool(tool) {
    currentTool = tool;
    document.querySelectorAll('.tool-group button').forEach(btn => btn.classList.remove('active'));
    
    if (tool === 'pencil') document.getElementById('btnPencil').classList.add('active');
    if (tool === 'line') document.getElementById('btnLine').classList.add('active');
    if (tool === 'rect') document.getElementById('btnRect').classList.add('active');
    if (tool === 'ellipse') document.getElementById('btnEllipse').classList.add('active');
    if (tool === 'eraser') document.getElementById('btnEraser').classList.add('active');
}

function updateColor(hex) {
    currentColor = hexToRgb(hex);
}

function updateThickness(val) {
    currentThickness = parseInt(val, 10);
    document.getElementById('thicknessValue').textContent = val + 'px';
}

// --- Mouse Interaction Controls ---

canvas.addEventListener('mousedown', function(event) {
    isDragging = true; //[cite: 1]
    const { x, y } = toScaledMouseCoords(event.clientX, event.clientY);
    
    startX = x;
    startY = y;
    previousMouseX = x; //[cite: 1]
    previousMouseY = y; //[cite: 1]

    saveSnapshot(); // บันทึกสถานะกระดานเดิมไว้

    if (currentTool === 'pencil') {
        drawThickPixel(x, y, currentThickness, currentColor.r, currentColor.g, currentColor.b);
    } else if (currentTool === 'eraser') {
        drawThickPixel(x, y, currentThickness, 255, 255, 255);
    }

    ctx.putImageData(imageData, 0, 0); //[cite: 1]
});

canvas.addEventListener('mousemove', function(event) {
    if (!isDragging) return; //[cite: 1]

    const { x, y } = toScaledMouseCoords(event.clientX, event.clientY); 

    if (currentTool === 'pencil') {
        drawLine(previousMouseX, previousMouseY, x, y, currentColor.r, currentColor.g, currentColor.b, currentThickness); //[cite: 1]
        previousMouseX = x; //[cite: 1]
        previousMouseY = y; //[cite: 1]
    } 
    else if (currentTool === 'eraser') {
        drawLine(previousMouseX, previousMouseY, x, y, 255, 255, 255, currentThickness);
        previousMouseX = x;
        previousMouseY = y;
    } 
    else if (currentTool === 'line') {
        restoreSnapshot(); // ล้างภาพชั่วคราวแล้ววาดเส้นใหม่
        drawLine(startX, startY, x, y, currentColor.r, currentColor.g, currentColor.b, currentThickness);
    } 
    else if (currentTool === 'rect') {
        restoreSnapshot();
        drawRect(startX, startY, x, y, currentColor.r, currentColor.g, currentColor.b, currentThickness);
    } 
    else if (currentTool === 'ellipse') {
        restoreSnapshot();
        const cx = Math.floor((startX + x) / 2);
        const cy = Math.floor((startY + y) / 2);
        const rx = Math.abs(Math.floor((x - startX) / 2));
        const ry = Math.abs(Math.floor((y - startY) / 2));
        drawEllipseOutline(cx, cy, rx, ry, currentColor.r, currentColor.g, currentColor.b, currentThickness);
    }

    ctx.putImageData(imageData, 0, 0); //[cite: 1]
});

canvas.addEventListener('mouseup', function(event) {
    isDragging = false; //[cite: 1]
});

canvas.addEventListener('mouseleave', function() {
    isDragging = false;
});


clearCanvas();

</script>
</body>
</html>
