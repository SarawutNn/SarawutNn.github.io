<!DOCTYPE html>
<html>

<head>
    <title>Lighting</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        /* ===== Windows-style flyout sliders (Light Position) ===== */
        #os-slider-panel {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 20;
            width: 260px;
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: rgba(32, 32, 32, 0.78);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
            color: #eee;
        }

        .os-slider-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .os-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e8e8e8;
        }

        .os-icon svg {
            width: 100%;
            height: 100%;
        }

        input[type=range].os-slider {
            -webkit-appearance: none;
            appearance: none;
            flex: 1;
            height: 4px;
            border-radius: 999px;
            background: linear-gradient(to right,
                    #29a3ef 0%,
                    #29a3ef var(--val, 50%),
                    rgba(255, 255, 255, 0.2) var(--val, 50%),
                    rgba(255, 255, 255, 0.2) 100%);
            outline: none;
            cursor: pointer;
            margin: 0;
        }

        input[type=range].os-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #29a3ef;
            box-shadow: 0 0 0 8px rgba(255, 255, 255, 0.10), 0 1px 3px rgba(0, 0, 0, 0.4);
            transition: box-shadow 0.15s ease;
        }

        input[type=range].os-slider:hover::-webkit-slider-thumb,
        input[type=range].os-slider:active::-webkit-slider-thumb {
            box-shadow: 0 0 0 10px rgba(255, 255, 255, 0.16), 0 1px 3px rgba(0, 0, 0, 0.4);
        }

        input[type=range].os-slider::-moz-range-track {
            height: 4px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.2);
        }

        input[type=range].os-slider::-moz-range-progress {
            height: 4px;
            border-radius: 999px;
            background: #29a3ef;
        }

        input[type=range].os-slider::-moz-range-thumb {
            width: 15px;
            height: 15px;
            border: none;
            border-radius: 50%;
            background: #29a3ef;
            box-shadow: 0 0 0 8px rgba(255, 255, 255, 0.10), 0 1px 3px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>

<body>

    <!-- Windows-style light position sliders -->
    <div id="os-slider-panel">
        <div class="os-slider-row">
            <div class="os-icon" title="X position">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12h18" />
                    <path d="M7 8l-4 4 4 4" />
                    <path d="M17 8l4 4-4 4" />
                </svg>
            </div>
            <input type="range" class="os-slider" id="slider-x" min="-10" max="10" step="0.1" value="3">
        </div>
        <div class="os-slider-row">
            <div class="os-icon" title="Y position">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3v18" />
                    <path d="M8 7l4-4 4 4" />
                    <path d="M8 17l4 4 4-4" />
                </svg>
            </div>
            <input type="range" class="os-slider" id="slider-y" min="0" max="10" step="0.1" value="5">
        </div>
        <div class="os-slider-row">
            <div class="os-icon" title="Z position">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="4" width="10" height="10" rx="1.5" />
                    <path d="M8 14l10 6" />
                    <path d="M14 4l6 4v10" opacity="0.55" />
                </svg>
            </div>
            <input type="range" class="os-slider" id="slider-z" min="-10" max="10" step="0.1" value="3">
        </div>
    </div>

    <!-- core three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Shadow
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();

        
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 1, 2);
        camera.lookAt(0, 0, 0);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(3, 5, 3);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const ambientLight = new THREE.AmbientLight(0x606088, 0.6);
        scene.add(ambientLight);
        
        scene.background = new THREE.Color(0xaae8ff);
        
        scene.fog = new THREE.Fog(0xffffff, 5, 10);

        // ===== Windows-style flyout sliders for Light Position =====
        const sliderX = document.getElementById('slider-x');
        const sliderY = document.getElementById('slider-y');
        const sliderZ = document.getElementById('slider-z');
        const positionSliders = [sliderX, sliderY, sliderZ];

        function updateSliderFill(input) {
            const min = parseFloat(input.min);
            const max = parseFloat(input.max);
            const val = parseFloat(input.value);
            const percent = ((val - min) / (max - min)) * 100;
            input.style.setProperty('--val', percent + '%');
        }

        function syncSlidersFromLight() {
            sliderX.value = directionalLight.position.x;
            sliderY.value = directionalLight.position.y;
            sliderZ.value = directionalLight.position.z;
            positionSliders.forEach(updateSliderFill);
        }

        sliderX.addEventListener('input', () => {
            directionalLight.position.x = parseFloat(sliderX.value);
            updateSliderFill(sliderX);
        });
        sliderY.addEventListener('input', () => {
            directionalLight.position.y = parseFloat(sliderY.value);
            updateSliderFill(sliderY);
        });
        sliderZ.addEventListener('input', () => {
            directionalLight.position.z = parseFloat(sliderZ.value);
            updateSliderFill(sliderZ);
        });

        syncSlidersFromLight();

        // ===== Mouse interaction: คลิกที่พื้นเพื่อขยับตำแหน่งไฟ =====
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
        // แปลงตำแหน่ง mouse เป็นค่า normalized (-1 ถึง 1)
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObject(plane);

        if (intersects.length > 0) {
            const point = intersects[0].point;
            directionalLight.position.set(point.x, 3, point.z); // ยกสูงจากพื้น 3 หน่วย
        
                // อัปเดตค่าใน GUI ให้ตรงกับตำแหน่งใหม่ด้วย
             syncSlidersFromLight();
            }
    
        });

        
        // Panoramic 360-degree EXR skybox
        const exrSkyboxUrl = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/1k/venice_sunset_1k.exr';
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.EXRLoader()
            .setDataType(THREE.UnsignedByteType)
            .load(exrSkyboxUrl, (texture) => {
                const skybox = pmremGenerator.fromEquirectangular(texture).texture;
                scene.background = skybox;
                scene.environment = skybox;

                texture.dispose();
                pmremGenerator.dispose();
            }, undefined, (error) => {
                console.error('Unable to load EXR skybox:', error);
            });
        
        
         const loader = new THREE.GLTFLoader();
         loader.load('https://sarawutnn.github.io/Chinchan3.glb', (gltf) => {
         const model = gltf.scene;
         model.traverse((child) => {
           if (child.isMesh) {
               child.castShadow = true;
               child.receiveShadow = true;
           }
         });
         model.scale.set(2, 2, 2); // ปรับขนาดถ้าโมเดลใหญ่/เล็กเกินไป
         model.position.set(0, 1, 0);
         scene.add(model);
         });



        //ใส่พื้น
        const texFloor = new THREE.TextureLoader().load('https://sibsansuk.github.io/mossy_cobblestone_diff_1k.jpg', t => {
        });
        const matFloor = new THREE.MeshStandardMaterial({
            map: texFloor
        });
        const planeGeometry = new THREE.PlaneGeometry(10, 10);
        const plane = new THREE.Mesh(planeGeometry, matFloor);
        plane.rotation.x = -Math.PI / 2; 
        plane.receiveShadow = true;
        scene.add(plane);

        const metalBoxGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
        const metalBoxMat = new THREE.MeshStandardMaterial({
            color: 0xf8f8f8,
            metalness: 1.0,
            roughness: 0.1
        });
        const metalBox = new THREE.Mesh(metalBoxGeo, metalBoxMat);
        metalBox.position.set(1.5, 0.26, 0);
        metalBox.castShadow = true;
        metalBox.receiveShadow = true;
        scene.add(metalBox);

        
        const rubberConeGeo = new THREE.ConeGeometry(0.3, 0.6, 32);
        const rubberConeMat = new THREE.MeshStandardMaterial({
            color: 0x3322aa,
            metalness: 0.0,
            roughness: 0.9
        });
        const rubberCone = new THREE.Mesh(rubberConeGeo, rubberConeMat);
        rubberCone.position.set(0, 0.31, -1.5);
        rubberCone.castShadow = true;
        rubberCone.receiveShadow = true;
        scene.add(rubberCone);


        const emerSphereGeo = new THREE.SphereGeometry(0.35, 32, 32);
        const emerSphereMat = new THREE.MeshStandardMaterial({
            color: 0x00dd77,
            metalness: 0.8,
            roughness: 0.3
        });
        const emerSphere = new THREE.Mesh(emerSphereGeo, emerSphereMat);
        emerSphere.position.set(-1.5, 0.35, 0);
        emerSphere.castShadow = true;
        emerSphere.receiveShadow = true;
        scene.add(emerSphere);

        
        function animate(t) {
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate(0);

        window.addEventListener('keydown', (event) => {

        });

    </script>
</body>

</html>
