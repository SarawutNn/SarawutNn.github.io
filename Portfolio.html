<!DOCTYPE html>
<html>

<head>
    <title>GPU Shadow</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>

        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xC69C7B);
        
        const camera = new THREE.PerspectiveCamera(65,window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 3.5, 5 );
        camera.lookAt(0, 0, 0);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 1.3, 0);
        controls.update();

        const Light = new THREE.DirectionalLight(0xffffff, 1);
        Light.position.set(1, 5, 1);
        scene.add(Light);

        /*const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(ambientLight);*/

        const mainLight = new THREE.DirectionalLight(0xffffff, 0.5);
        mainLight.position.set(5, 10, 7);
        scene.add(mainLight);

        const lampLight1 = new THREE.PointLight(0xee0000, 1.8, 10, 2);
        lampLight1.position.set(-1.9, 3.8, -2.7); 
        scene.add(lampLight1);

        /*const helper = new THREE.PointLightHelper(lampLight1, 0.3);
        scene.add(helper);*/

        const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
        fillLight.position.set(-5, 3, -5);
        scene.add(fillLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 5, 5);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const loader = new THREE.GLTFLoader();
            loader.load("https://sarawutnn.github.io/room.glb", function (gltf) {
                scene.add(gltf.scene);
            });
        
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        const targetCameraPosition = { x: 1.5, y: 2.2, z: 0.8 };
        const targetLookAt = { x: -5.5, y: 2.0, z: -3.0 };        

        window.addEventListener('click', (event) => {
            
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            if (intersects.length > 0) {
                const clickedObject = intersects[0].object;
                console.log("Clicked object:", clickedObject.name);

                if (clickedObject.name.includes("About") || clickedObject.name.includes("Text") || clickedObject.name.includes("Board")) {
                    
                    controls.enabled = false;

                    gsap.to(camera.position, {
                        x: targetCameraPosition.x,
                        y: targetCameraPosition.y,
                        z: targetCameraPosition.z,
                        duration: 1.5,
                        ease: "power2.inOut"
                    });

                    gsap.to(controls.target, {
                        x: targetLookAt.x,
                        y: targetLookAt.y,
                        z: targetLookAt.z,
                        duration: 1.5,
                        ease: "power2.inOut",
                        onUpdate: () => {
                            camera.lookAt(controls.target);
                        },
                        onComplete: () => {
                            controls.enabled = true;
                        }
                    });
                }
            }
        });

        function animate(t) {
            //myObj.rotation.x = t * 0.001;
            //myObj.rotation.y = t * 0.002;
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate(0);

        
            


    </script>
</body>

</html>
