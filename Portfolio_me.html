<!DOCTYPE html>
<html>

<head>
    <title>GPU Shadow</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xC69C7B);
        
        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 3.5, 5);
        camera.lookAt(0, 0, 0);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 1.3, 0);
        controls.update();

        const ambientLight = new THREE.AmbientLight(0xfff5e6, 0.6);
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x443322, 0.5);
        scene.add(hemiLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.7);
        directionalLight.position.set(5, 8, 5);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 1024;
        directionalLight.shadow.mapSize.height = 1024;
        scene.add(directionalLight);

        const tvSpotLight = new THREE.SpotLight(0xffffff, 1.5, 6, Math.PI / 4, 0.5);
        tvSpotLight.position.set(-1.2, 1.6, -2.0);
        tvSpotLight.target.position.set(0, 0, 1);
        scene.add(tvSpotLight);
        scene.add(tvSpotLight.target);

        const lampLight1 = new THREE.PointLight(0xee0000, 0, 10, 2); 
        lampLight1.position.set(-1.9, 3.8, -2.7); 
        scene.add(lampLight1);

        let isLampOn = false;
        const targetLampIntensity = 1.8;

        const flagGeometry = new THREE.PlaneGeometry(1.2, 0.8, 64, 64);
        flagGeometry.translate(0.6, 0, 0);

        const flagUniforms = {
            uTime: { value: 0.0 },
            uLightDir: { value: new THREE.Vector3(1.5, 0.8, 1.0).normalize() }
        };

        const flagVertexShader = `
            uniform float uTime;
            varying vec3 vNormal;
            varying vec3 vPosW;

            float getWave(vec2 p) {
                return sin(p.x * 6.0 + uTime * 3.0) * 0.16 * p.x;
            }

            void main() {
                vec3 pos = position;
                pos.z += getWave(pos.xy);

                float eps = 0.01;
                float dzdx = (getWave(pos.xy + vec2(eps, 0.0)) - getWave(pos.xy - vec2(eps, 0.0))) / (2.0 * eps);
                float dzdy = (getWave(pos.xy + vec2(0.0, eps)) - getWave(pos.xy - vec2(0.0, eps))) / (2.0 * eps);
                
                vec3 computedNormal = normalize(vec3(-dzdx, -dzdy, 1.0));
                vNormal = normalize(normalMatrix * computedNormal);

                vec4 worldPosition = modelMatrix * vec4(pos, 1.0);
                vPosW = worldPosition.xyz;

                gl_Position = projectionMatrix * viewMatrix * worldPosition;
            }
        `;

        const flagFragmentShader = `
            precision mediump float;
            uniform vec3 uLightDir;
            varying vec3 vNormal;
            varying vec3 vPosW;

            void main() {
                vec3 N = normalize(vNormal);
                vec3 L = normalize(uLightDir);
                vec3 V = normalize(cameraPosition - vPosW);

                float NdotL = max(dot(N, L), 0.0);

                float cel;
                if (NdotL > 0.7) {
                    cel = 1.0;
                } else if (NdotL > 0.35) {
                    cel = 0.6;
                } else {
                    cel = 0.3;
                }

                vec3 H = normalize(L + V);
                float NdotH = max(dot(N, H), 0.0);
                float spec = pow(NdotH, 32.0);
                float celSpec = step(0.4, spec);

                vec3 baseColor = vec3(0.0, 0.55, 1.0);
                vec3 finalColor = baseColor * cel + vec3(1.0) * celSpec * 0.8;

                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        const flagMaterial = new THREE.ShaderMaterial({
            vertexShader: flagVertexShader,
            fragmentShader: flagFragmentShader,
            uniforms: flagUniforms,
            side: THREE.DoubleSide
        });

        const flagMesh = new THREE.Mesh(flagGeometry, flagMaterial);
        flagMesh.position.set(-2.8, 4.5, 2.2);
        flagMesh.rotation.y = Math.PI / 2;
        flagMesh.scale.set(0.7, 0.7, 0.7);
        scene.add(flagMesh);

        let mixer;
        const clock = new THREE.Clock();
        let isDoorOpen = false;

        const loader = new THREE.GLTFLoader();
        loader.load("https://sarawutnn.github.io/portfolio2.glb", function (gltf) {
            scene.add(gltf.scene);

            gltf.scene.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;

                    if (child.material) {
                        child.material.roughness = 0.55;
                        child.material.metalness = 0.05;
                    }

                    if (child.name.toLowerCase().includes("picme") || child.name.toLowerCase().includes("tv")) {
                        if (child.material) {
                            child.material.emissive = new THREE.Color(0xffffff);
                            child.material.emissiveMap = child.material.map;
                            child.material.emissiveIntensity = 0.8;
                        }
                    }
                }
            });

            if (gltf.animations && gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(gltf.scene);
                gltf.animations.forEach((clip) => {
                    const action = mixer.clipAction(clip);
                    action.setLoop(THREE.LoopRepeat);
                    action.play();
                });
            }
        });
        
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        const aboutCameraPos = { x: 1.5, y: 2.2, z: 0.8 };
        const aboutLookAt = { x: -5.5, y: 2.0, z: -3.0 };        

        const tvCameraPos = { x: 0.8, y: 1.8, z: 0.0 };
        const tvLookAt = { x: -1.2, y: 1.6, z: -2.0 };

        const contactCameraPos = { x: 1.9, y: 1.9, z: -0.8 };
        const contactLookAt = { x: 2.0, y: 1.6, z: -2.5 };

        window.addEventListener('click', (event) => {
            
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            if (intersects.length > 0) {
                const clickedObject = intersects[0].object;

                if (
                    clickedObject.name.toLowerCase().includes("lamp") || 
                    clickedObject.name.toLowerCase().includes("light") ||
                    clickedObject.name.toLowerCase().includes("red")
                ) {
                    isLampOn = !isLampOn;
                    gsap.to(lampLight1, {
                        intensity: isLampOn ? targetLampIntensity : 0,
                        duration: 0.5,
                        ease: "power2.inOut"
                    });
                    return;
                }

                if (
                    clickedObject.name.toLowerCase().includes("github") || 
                    clickedObject.name.toLowerCase().includes("git")
                ) {
                    window.open("https://sarawutnn.github.io", "_blank");
                    return;
                }

                if (clickedObject.name.includes("About") || clickedObject.name.includes("Text") || clickedObject.name.includes("Board")) {
                    moveCamera(aboutCameraPos, aboutLookAt);
                }

                if (clickedObject.name.includes("picMe") || clickedObject.name.includes("TV2")) {
                    moveCamera(tvCameraPos, tvLookAt);
                }

                if (clickedObject.name.includes("contact") || clickedObject.name.includes("Email")) {
                    moveCamera(contactCameraPos, contactLookAt);
                }

                if (clickedObject.name.includes("door_refig")) {
                    const openAngle = THREE.MathUtils.degToRad(85);
                    const targetRotationY = isDoorOpen ? 0 : openAngle;

                    gsap.to(clickedObject.rotation, {
                        y: targetRotationY,
                        duration: 1.2,
                        ease: "power2.inOut",
                        onComplete: () => {
                            isDoorOpen = !isDoorOpen;
                        }
                    });
                }
            }
        });

        function moveCamera(targetPos, targetLook) {
            controls.enabled = false;

            gsap.to(camera.position, {
                x: targetPos.x,
                y: targetPos.y,
                z: targetPos.z,
                duration: 1.5,
                ease: "power2.inOut"
            });

            gsap.to(controls.target, {
                x: targetLook.x,
                y: targetLook.y,
                z: targetLook.z,
                duration: 1.5,
                ease: "power2.inOut",
                onUpdate: () => {
                    camera.lookAt(controls.target);
                },
                onComplete: () => {
                    controls.enabled = true;
                }
            });
        }

        function animate(time) {
            requestAnimationFrame(animate);

            flagUniforms.uTime.value = time * 0.001;

            const delta = clock.getDelta();
            if (mixer) {
                mixer.update(delta);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        requestAnimationFrame(animate);

    </script>
</body>

</html>
